<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="600">Safe Ask — Privacy Gateway Architecture</text>

  <!-- Client/Agent box -->
  <rect x="40" y="200" width="160" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="120" y="250" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="500">Agent /</text>
  <text x="120" y="272" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="500">Client</text>
  <text x="120" y="300" text-anchor="middle" fill="#64748b" font-size="12">(LLM consumer)</text>

  <!-- Arrow: Client → Gateway -->
  <line x1="200" y1="260" x2="280" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="248" text-anchor="middle" fill="#94a3b8" font-size="11">prompt</text>

  <!-- Gateway box (main) -->
  <rect x="280" y="80" width="480" height="360" rx="16" fill="url(#gatewayGrad)" stroke="#475569" stroke-width="2"/>
  <text x="520" y="115" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="600">Safe Ask Gateway</text>

  <!-- Stage 1: PII Detection -->
  <rect x="310" y="140" width="420" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520" y="170" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="500">1 · PII Detection</text>
  <text x="700" y="170" text-anchor="end" fill="#94a3b8" font-size="11">NRIC · phones · emails · addresses</text>

  <!-- Arrow between stages -->
  <line x1="520" y1="190" x2="520" y2="205" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Secret Blocker -->
  <rect x="310" y="205" width="420" height="50" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="520" y="235" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="500">2 · Secret Blocker</text>
  <text x="700" y="235" text-anchor="end" fill="#94a3b8" font-size="11">API keys · tokens · credentials</text>

  <!-- Arrow -->
  <line x1="520" y1="255" x2="520" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Entity Redaction -->
  <rect x="310" y="270" width="420" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="520" y="300" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="500">3 · Entity Redaction</text>
  <text x="700" y="300" text-anchor="end" fill="#94a3b8" font-size="11">→ [[TYPE_HEX]] placeholders</text>

  <!-- Arrow -->
  <line x1="520" y1="320" x2="520" y2="335" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: Tier Routing -->
  <rect x="310" y="335" width="420" height="50" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="520" y="365" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="500">4 · Tier Routing</text>
  <text x="700" y="365" text-anchor="end" fill="#94a3b8" font-size="11">flash · frontier · deep</text>

  <!-- Supervisor badge -->
  <rect x="330" y="392" width="380" height="28" rx="6" fill="#1a1a2e" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="520" y="411" text-anchor="middle" fill="#a78bfa" font-size="11">⚙ Supervisor system message injected</text>

  <!-- Arrow: Gateway → Provider -->
  <line x1="760" y1="260" x2="840" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="248" text-anchor="middle" fill="#94a3b8" font-size="11">sanitized</text>

  <!-- LLM Provider box -->
  <rect x="840" y="200" width="160" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="920" y="250" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="500">LLM</text>
  <text x="920" y="272" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="500">Provider</text>
  <text x="920" y="300" text-anchor="middle" fill="#64748b" font-size="12">(external)</text>

  <!-- Arrow: Provider → Gateway (response) -->
  <line x1="840" y1="320" x2="760" y2="320" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="800" y="340" text-anchor="middle" fill="#4ade80" font-size="11">response</text>

  <!-- Response processing strip -->
  <rect x="280" y="460" width="480" height="70" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="520" y="490" text-anchor="middle" fill="#86efac" font-size="14" font-weight="500">Response Processing</text>
  <text x="520" y="512" text-anchor="middle" fill="#94a3b8" font-size="12">scan for leaks · restore placeholders · audit log</text>

  <!-- Arrow down from gateway to response processing -->
  <line x1="520" y1="440" x2="520" y2="460" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: Response processing → Client -->
  <line x1="280" y1="495" x2="200" y2="495" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="200" y1="495" x2="200" y2="320" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="175" y="420" text-anchor="middle" fill="#4ade80" font-size="11">restored</text>
  <text x="175" y="435" text-anchor="middle" fill="#4ade80" font-size="11">response</text>

  <!-- Legend -->
  <rect x="840" y="460" width="320" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="860" y="485" fill="#94a3b8" font-size="12" font-weight="500">Data flow</text>
  <line x1="860" y1="500" x2="890" y2="500" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="504" fill="#cbd5e1" font-size="11">outbound (sanitized)</text>
  <line x1="860" y1="520" x2="890" y2="520" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="900" y="524" fill="#cbd5e1" font-size="11">inbound (restored)</text>
  <text x="860" y="550" fill="#64748b" font-size="10">Provider never sees raw sensitive data</text>
</svg>
